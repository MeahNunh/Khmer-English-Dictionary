    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA Service Worker registered:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        // Helper: Convert digits & dates into full Khmer formatted text (e.g. ថ្ងៃទី១៥ ខែវិច្ឆិកា ឆ្នាំ២០២៣)
        function formatKhmerDate(dateString) {
            if (!dateString) return 'មិនមានទិន្នន័យ';
            
            const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
            const khmerMonths = [
                'មករា', 'កុម្ភៈ', 'មីនា', 'មេសា', 'ឧសភា', 'មិថុនា',
                'កក្កដា', 'សីហា', 'កញ្ញា', 'តុលា', 'វិច្ឆិកា', 'ធ្នូ'
            ];

            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;

            const day = date.getDate();
            const month = date.getMonth();
            const year = date.getFullYear();

            const toKhmerNum = (num) => String(num).split('').map(d => khmerDigits[parseInt(d)] || d).join('');

            return `ថ្ងៃទី${toKhmerNum(day)} ខែ${khmerMonths[month]} ឆ្នាំ${toKhmerNum(year)}`;
        }

        // Lightweight Markdown Parser
        function renderMarkdown(text) {
            if (!text) return '';
            let html = text
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code class="bg-slate-200 dark:bg-slate-700 px-1 py-0.5 rounded text-xs">$1</code>')
                .replace(/^\s*-\s+(.*)$/gim, '<li class="ml-4 list-disc">$1</li>')
                .replace(/\n/g, '<br>');
            return html;
        }

            { id: "3", km: "សូមទោស", en: "Sorry / Excuse me", category: "General", source: "ខ្មែរដើម (Khmer Native)", date: "2023-11-16", phonetic: "[som-toas]", def: "ពាក្យស្នើសុំការអត់ទោស ឬប្រើនៅពេលរំខាននរណាម្នាក់។", examples: ["សូមទោស ខ្ញុំមិនបានចេតនាទេ។ — Sorry, I didn't mean to."] },
            { id: "4", km: "សាលារៀន", en: "School", category: "Education", source: "បាលី-សំស្ក្រឹត (Pali/Sanskrit)", date: "2023-11-17", phonetic: "[sa-la-rien]", def: "កន្លែងសម្រាប់អប់រំ និងបណ្តុះបណ្តាលសិស្សានុសិស្ស។", examples: ["កុមារជិះកង់ទៅសាលារៀន។ — Children ride bicycles to school."] },

            { id: "19", km: "ទូរស័ព្ទ", en: "Telephone / Phone", category: "Tech", source: "បារាំង/សំស្ក្រឹត (Greek/Sanskrit)", date: "2023-11-30", phonetic: "[tou-ro-sap]", def: "ឧបករណ៍អេឡិចត្រូនិចសម្រាប់ទំនាក់ទំនងសំឡេងពីចម្ងាយ។", examples: ["ទូរស័ព្ទរបស់ខ្ញុំអស់ថ្ម។ — My phone battery is dead."] },
            { id: "20", km: "គ្រួសារ", en: "Family", category: "General", source: "បាលី (Pali)", date: "2023-12-01", phonetic: "[krua-sar]", def: "ក្រុមមនុស្សដែលត្រូវជាសាច់ញាតិនឹងគ្នា។", examples: ["គ្រួសារខ្ញុំរស់នៅជុំគ្នាដោយសប្បាយ។ — My family lives happily together."] }
        ];

        // Custom Words Storage Handler
        function getCombinedDictionary() {
            const customWords = JSON.parse(localStorage.getItem('m_dict_custom_words') || '[]');
            return [...defaultDictionaryData, ...customWords];
        }

        // State Variables
        let currentTab = 'search';
        let activeSelectedId = null;
        let selectedCategory = 'All';
        let searchDirection = 'both';
        let favorites = JSON.parse(localStorage.getItem('m_dict_favs') || '[]');
        let historyList = JSON.parse(localStorage.getItem('m_dict_hist') || '[]');

        window.addEventListener('DOMContentLoaded', () => {
            renderCurrentView();
            updateFavCount();
            checkThemePreference();
        });

        // Add Word Modal Open/Close
        function openAddWordModal() {
            document.getElementById('add-word-modal').classList.remove('hidden');
        }

        function closeAddWordModal() {
            document.getElementById('add-word-modal').classList.add('hidden');
            document.getElementById('add-word-form').reset();
        }

        // Save Custom Word to LocalStorage
        function saveCustomWord(event) {
            event.preventDefault();
            const km = document.getElementById('add-km').value.trim();
            const en = document.getElementById('add-en').value.trim();
            const category = document.getElementById('add-cat').value;
            const phonetic = document.getElementById('add-phonetic').value.trim();
            const def = document.getElementById('add-def').value.trim();
            const ex = document.getElementById('add-ex').value.trim();

            const newEntry = {
                id: 'custom_' + Date.now(),
                km: km,
                en: en,
                category: category,
                source: "User Added",
                date: new Date().toISOString().split('T')[0],
                phonetic: phonetic ? `[${phonetic}]` : '',
                def: def || 'User defined word entry.',
                examples: ex ? [ex] : []
            };

            const customWords = JSON.parse(localStorage.getItem('m_dict_custom_words') || '[]');
            customWords.unshift(newEntry);
            localStorage.setItem('m_dict_custom_words', JSON.stringify(customWords));

            closeAddWordModal();
            renderCurrentView();
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(btn => {
                if (btn.innerText.includes(cat)) {
                    btn.className = "cat-chip active px-3 py-1 rounded-full font-medium whitespace-nowrap bg-blue-600 text-white transition";
                } else {
                    btn.className = "cat-chip px-3 py-1 rounded-full font-medium whitespace-nowrap bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 transition";
                }
            });
            renderCurrentView();
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('m_dict_theme', isDark ? 'dark' : 'light');
        }

        function checkThemePreference() {
            const saved = localStorage.getItem('m_dict_theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-sun';
            }
        }

        function toggleSearchDirection() {
            const label = document.getElementById('direction-label');
            if (searchDirection === 'both') {
                searchDirection = 'km-en';
                label.innerHTML = 'KM <i class="fa-solid fa-arrow-right text-[10px]"></i> EN';
            } else if (searchDirection === 'km-en') {
                searchDirection = 'en-km';
                label.innerHTML = 'EN <i class="fa-solid fa-arrow-right text-[10px]"></i> KM';
            } else {
                searchDirection = 'both';
                label.innerHTML = 'ALL <i class="fa-solid fa-arrows-rotate text-[10px]"></i>';
            }
            handleSearch();
        }

        function handleSearch() {
            if (currentTab !== 'search') switchTab('search');
            else renderCurrentView();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            handleSearch();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['search', 'favorites', 'history'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    btn.className = "flex flex-col items-center py-1.5 px-4 text-blue-600 dark:text-blue-400 font-medium";
                } else {
                    btn.className = "flex flex-col items-center py-1.5 px-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200";
                }
            });
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('list-container');
            const searchVal = document.getElementById('search-input').value.trim().toLowerCase();
            const clearBtn = document.getElementById('clear-search-btn');

            clearBtn.classList.toggle('hidden', searchVal.length === 0);

            const allData = getCombinedDictionary();
            let displayItems = [];

            if (currentTab === 'search') {
                displayItems = allData.filter(item => {
                    const matchKm = item.km.toLowerCase().includes(searchVal);
                    const matchEn = item.en.toLowerCase().includes(searchVal);
                    const matchDef = item.def ? item.def.toLowerCase().includes(searchVal) : false;
                    const matchCategory = selectedCategory === 'All' || item.category === selectedCategory;

                    let matchDir = true;
                    if (searchDirection === 'km-en') matchDir = matchKm;
                    else if (searchDirection === 'en-km') matchDir = matchEn;
                    else matchDir = matchKm || matchEn || matchDef;

                    return matchCategory && matchDir;
                });
            } else if (currentTab === 'favorites') {
                displayItems = allData.filter(item => favorites.includes(item.id));
            } else if (currentTab === 'history') {
                displayItems = historyList
                    .map(id => allData.find(item => item.id === id))
                    .filter(Boolean);
            }

            if (displayItems.length === 0) {
                container.innerHTML = `
                    <div class="h-64 flex flex-col items-center justify-center text-slate-400 text-center p-4">
                        <i class="fa-solid fa-folder-open text-3xl mb-2 opacity-50"></i>
                        <p class="text-xs">No records found</p>
                    </div>`;
                return;
            }

            container.innerHTML = displayItems.map(item => `
                <div onclick="openDetailDrawer('${item.id}')" class="bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200/70 dark:border-slate-700/60 active:scale-[0.99] transition flex items-center justify-between shadow-xs">
                    <div>
                        <div class="font-khmer font-bold text-slate-900 dark:text-white text-base leading-snug">${item.km}</div>
                        <div class="text-xs text-blue-600 dark:text-blue-400 font-medium">${item.en}</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-[9px] font-semibold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400">${item.category}</span>
                        <i class="fa-solid fa-chevron-right text-xs text-slate-300 dark:text-slate-600"></i>
                    </div>
                </div>
            `).join('');
        }

        function openDetailDrawer(id) {
            const allData = getCombinedDictionary();
            const item = allData.find(d => d.id === id);
            if (!item) return;

            activeSelectedId = id;

            historyList = [id, ...historyList.filter(hId => hId !== id)].slice(0, 20);
            localStorage.setItem('m_dict_hist', JSON.stringify(historyList));

            document.getElementById('modal-khmer').innerText = item.km;
            document.getElementById('modal-english').innerText = item.en;
            document.getElementById('modal-phonetic').innerText = item.phonetic || '';
            document.getElementById('modal-category').innerText = `Cat: ${item.category}`;
            document.getElementById('modal-source').innerText = `Origin: ${item.source}`;
            
            const dateSpan = document.getElementById('modal-date');
            dateSpan.innerText = formatKhmerDate(item.date);

            document.getElementById('modal-definition').innerHTML = renderMarkdown(item.def);

            const exWrap = document.getElementById('modal-examples-wrap');
            const exList = document.getElementById('modal-examples');
            if (item.examples && item.examples.length > 0) {
                exList.innerHTML = item.examples.map(ex => `
                    <li class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-900/40 text-slate-700 dark:text-slate-300 border-l-2 border-blue-500">${ex}</li>
                `).join('');
                exWrap.classList.remove('hidden');
            } else {
                exWrap.classList.add('hidden');
            }

            updateModalFavIcon();

            const drawer = document.getElementById('detail-drawer');
            const content = document.getElementById('drawer-content');
            drawer.classList.remove('pointer-events-none', 'opacity-0');
            drawer.classList.add('opacity-100');
            content.classList.remove('drawer-down');
            content.classList.add('drawer-up');
        }

        function closeDetailDrawer() {
            const drawer = document.getElementById('detail-drawer');
            const content = document.getElementById('drawer-content');
            content.classList.remove('drawer-up');
            content.classList.add('drawer-down');
            drawer.classList.remove('opacity-100');
            drawer.classList.add('opacity-0', 'pointer-events-none');
            
            if (currentTab !== 'search') renderCurrentView();
        }

        function toggleFavoriteCurrent() {
            if (!activeSelectedId) return;

            const idx = favorites.indexOf(activeSelectedId);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.push(activeSelectedId);

            localStorage.setItem('m_dict_favs', JSON.stringify(favorites));
            updateModalFavIcon();
            updateFavCount();
        }

        function updateModalFavIcon() {
            const isFav = favorites.includes(activeSelectedId);
            const icon = document.getElementById('modal-fav-icon');
            const btn = document.getElementById('modal-fav-btn');

            if (isFav) {
                icon.className = 'fa-solid fa-star text-amber-500 text-base';
                btn.classList.add('bg-amber-50', 'dark:bg-amber-900/30');
            } else {
                icon.className = 'fa-regular fa-star text-slate-400 text-base';
                btn.classList.remove('bg-amber-50', 'dark:bg-amber-900/30');
            }
        }

        function updateFavCount() {
            document.getElementById('count-fav').innerText = favorites.length;
        }

        function speakEnglishWord() {
            if (!activeSelectedId) return;
            const allData = getCombinedDictionary();
            const item = allData.find(d => d.id === activeSelectedId);
            if (!item) return;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(item.en);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakKhmerWord() {
            if (!activeSelectedId) return;
            const allData = getCombinedDictionary();
            const item = allData.find(d => d.id === activeSelectedId);
            if (!item) return;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(item.km);
                utterance.lang = 'km-KH';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
